# Experiment: same as cbis_ddsm.yaml but with more epochs/patience so the
# ReduceLROnPlateau scheduler (added to train.py) has room to kick in.
dataset_name: cbis_ddsm
data_dir: data/processed/cbis_ddsm
class_names: ["benign", "malignant"]
num_classes: 2
image_size: 512

model:
  arch: resnet18
  pretrained: true

train:
  batch_size: 8
  epochs: 60
  lr: 0.0001
  weight_decay: 0.0001
  num_workers: 0
  use_class_weights: true
  early_stopping_patience: 15
  seed: 42

output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  run_name: cbis_ddsm_resnet18_v2

decision_threshold: 0.5
