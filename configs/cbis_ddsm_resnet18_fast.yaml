# Fast variant of cbis_ddsm_resnet18_v2.yaml for CPU-only training: 224px
# (ResNet18's native ImageNet input size, ~5x fewer pixels than 512px -> ~5x
# faster per batch) + larger batch size + tighter early stopping, so a full
# run finishes in a reasonable time on CPU instead of 60 epochs @ 512px.
dataset_name: cbis_ddsm
data_dir: data/processed/cbis_ddsm
class_names: ["benign", "malignant"]
num_classes: 2
image_size: 224

model:
  arch: resnet18
  pretrained: true

train:
  batch_size: 16
  epochs: 20
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 0
  use_class_weights: true
  early_stopping_patience: 6
  seed: 42

output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  run_name: cbis_ddsm_resnet18_fast

decision_threshold: 0.5
