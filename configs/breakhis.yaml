# Config for the BreakHis dataset (benign vs malignant)
# Kaggle: e.g. ambarish/breakhis or forderation/breakhis-400x
dataset_name: breakhis
data_dir: data/processed/breakhis   # produced by src/prepare_breakhis.py
class_names: ["benign", "malignant"]
num_classes: 2
image_size: 224
magnification: "40X"                # 40X | 100X | 200X | 400X

model:
  arch: resnet18                    # BreakHis is smaller -> transfer learning works better
  pretrained: true

train:
  batch_size: 32
  epochs: 25
  lr: 0.0003
  weight_decay: 0.0001
  num_workers: 4
  use_class_weights: true           # ~31/69 benign/malignant imbalance
  early_stopping_patience: 6
  seed: 42

output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  run_name: breakhis_40x_resnet18
