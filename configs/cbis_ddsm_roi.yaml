# Trains on ROI-cropped lesion patches instead of full mammograms (see
# src/prepare_cbis_ddsm_roi.py). Much easier task than cbis_ddsm.yaml /
# cbis_ddsm_v3.yaml -- the model only has to classify a lesion that's already
# located, instead of finding it in a full mammogram first.
dataset_name: cbis_ddsm_roi
data_dir: data/processed/cbis_ddsm_roi
class_names: ["benign", "malignant"]
num_classes: 2
image_size: 224

model:
  arch: resnet18
  pretrained: true
  dropout: 0.4

train:
  batch_size: 32
  epochs: 50
  lr: 0.0003
  weight_decay: 0.0002
  num_workers: 0
  use_class_weights: true
  early_stopping_patience: 12
  seed: 42
  freeze_backbone_epochs: 3
  label_smoothing: 0.05
  amp: true

output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  run_name: cbis_ddsm_roi

decision_threshold: 0.5
