# EfficientNet-B0 on the combined mass+calc ROI dataset, as a stronger
# backbone than resnet18 (cbis_ddsm_roi.yaml / _v2.yaml topped out ~59-60%
# test accuracy).
dataset_name: cbis_ddsm_roi
data_dir: data/processed/cbis_ddsm_roi
class_names: ["benign", "malignant"]
num_classes: 2
image_size: 224

model:
  arch: efficientnet_b0
  pretrained: true
  dropout: 0.3

train:
  batch_size: 32
  epochs: 60
  lr: 0.0003
  weight_decay: 0.0002
  num_workers: 0
  use_class_weights: false
  early_stopping_patience: 15
  seed: 42
  freeze_backbone_epochs: 3
  label_smoothing: 0.0
  amp: true

output:
  checkpoint_dir: outputs/checkpoints
  log_dir: outputs/logs
  run_name: cbis_ddsm_roi_effnet

decision_threshold: 0.625
